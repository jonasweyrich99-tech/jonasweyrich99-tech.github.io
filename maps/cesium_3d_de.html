<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Deutschland 3D Debug (Cesium)</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.130/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.130/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width:100%; height:100%; margin:0; padding:0; overflow:hidden;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    // Optional: Trage hier deinen Cesium Ion Token ein (https://cesium.com/ion/)
    const CESIUM_ION_TOKEN = ""; // <-- if you have one, paste it here

    if (CESIUM_ION_TOKEN) {
      Cesium.Ion.defaultAccessToken = CESIUM_ION_TOKEN;
      console.log('Ion token gesetzt');
    } else {
      console.log('Kein Ion-Token gesetzt — WorldTerrain wird nicht verwendet (Fallback).');
    }

    // Initialisiern des Cesium-Viewer
    var viewer = new Cesium.Viewer('cesiumContainer',{
         shadows: false,
         geocoder: false,
         baseLayerPicker: false
      });

    // setze Heimat-Zoom auf Deutschland (Mitte Deutschland, große Höhe)
    const germanyHome = Cesium.Cartesian3.fromDegrees(10.45, 51.16, 2500000);
    // sofortige Startansicht
    viewer.camera.setView({ destination: germanyHome });

    // Home-Button überschreiben, damit er zur deutschen Ansicht fliegt
    if (viewer.homeButton && viewer.homeButton.viewModel && viewer.homeButton.viewModel.command) {
      viewer.homeButton.viewModel.command.beforeExecute.addEventListener(function(cmd) {
        cmd.cancel = true; // Standardverhalten verhindern
        viewer.camera.flyTo({ destination: germanyHome, duration: 1.5 });
      });
    }

    viewer.scene.debugShowFramesPerSecond = true;
    viewer.scene.screenSpaceCameraController.enableZoom = true;
    viewer.scene.screenSpaceCameraController.enableRotate = true;

    // Versuch: WorldTerrain nur verwenden, wenn Funktion vorhanden und Token gesetzt
    try {
      if (typeof Cesium.createWorldTerrain === 'function' && CESIUM_ION_TOKEN) {
        viewer.terrainProvider = Cesium.createWorldTerrain();
        viewer.scene.globe.depthTestAgainstTerrain = true;
        console.log('WorldTerrain gesetzt (Ion)');
      } else {
        console.log('WorldTerrain nicht gesetzt (kein Token oder Funktion fehlt).');
      }
    } catch (e) {
      console.warn('WorldTerrain Fehler:', e);
    }

    // OSM-Imagery (sichtbar auch ohne Ion)
    const osm= new Cesium.OpenStreetMapImageryProvider({
          url : '//a.tile.openstreetmap.org/',
          credit: new Cesium.Credit("\u003ca href=\"https://www.openstreetmap.org/copyright\""+
                                     "target=\"_blank\"\u003e\u0026copy; OpenStreetMap contributors\u003c/a\u003e", true)
     });
     viewer.imageryLayers.addImageryProvider(osm);
     console.log('OSM-Imagery hinzugefügt');

     // Hintergrundkarte festlegen - WMS der SmartMapping Karte. Leider unterstützt Cesium keine Vector-Tiles.
     const provider = new Cesium.WebMapServiceImageryProvider({
       url : 'https://sgx.geodatenzentrum.de/wms_basemapde',
       layers: "de_basemapde_web_raster_farbe",
       parameters: {
         transparent: true,
         format: "image/png",
       }
    });
    viewer.imageryLayers.addImageryProvider(provider);

    // Kamera auf uebergebenen Punkt zentrieren in einer bestimmten Hoehe
    viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(6.958215,50.932767, 1500.0),
                          orientation:{
                                heading: Cesium.Math.toRadians(0.0),
                                pitch : Cesium.Math.toRadians(-50.0),
                                roll : 0.0}
                        });


    // ----- LoD2-Gebäude vom Geodatenzentrum laden und darstellen -----
    (async function(){
      const tilesetUrl = "https://sg.geodatenzentrum.de/gdz_basemapde_3d_gebaeude/lod2_4978_null.json";
      console.log('Versuche LoD2-Tileset zu laden:', tilesetUrl);

      try {
        // asynchrones Laden (aus Beispiel)
        const tileset = await Cesium.Cesium3DTileset.fromUrl(tilesetUrl, { showOutline: false });
        // Stil wie im Beispiel: Wände/ Dächer unterschiedlich einfärben
        tileset.style = new Cesium.Cesium3DTileStyle({
          color : {
            conditions : [
              ["${surface} === 'wall'", "color('#f2f2f2')"],
              ["${surface} === 'roof'", "color('#ff5c4d')"],
              ["${surface} === 'bridge'", "color('#999999')"],
              ["true", "color('rgba(180,180,180,1)')"]
            ]
          }
        });

        viewer.scene.primitives.add(tileset);
        console.log('LoD2-Tileset hinzugefügt');

        // Auf das Tileset zoomen und dann auf Beispiel-Kameraposition fliegen
        await viewer.zoomTo(tileset);
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(6.958215, 50.932767, 1500.0),
          orientation: {
            heading: Cesium.Math.toRadians(0.0),
            pitch: Cesium.Math.toRadians(-50.0),
            roll: 0.0
          },
          duration: 1.2
        });
      } catch (err) {
        console.error('Fehler beim Laden/Anzeigen des LoD2-Tilesets:', err);
      }
    })();

    // WebGL check
    setTimeout(() => {
      try { console.log('WebGL:', !!viewer.scene.context._gl); } catch(e){ console.warn(e); }
    }, 800);

    console.log('Wenn die Szene schwarz bleibt: iframe direkt öffnen und DevTools (Console & Network) prüfen.');
  </script>
</body>
</html>
